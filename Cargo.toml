[package]
name = "tdars-toolkit"
version = "0.4.4"
authors = ["Lily Hopkins <lily@hpkns.uk>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bigdecimal = { version = "0.4.10", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["display"] }
# Also change dioxus version in CI build job
dioxus = { version = "0.7", features = ["router"] }
dioxus-sdk = { version = "0.7", features = ["time"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }
escpos = { version = "0.19.1", optional = true, features = ["usb"] }
getset = "0.1.7"
iso_currency = { version = "0.7.0", features = ["with-serde"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rust_xlsxwriter = { version = "0.99.0", features = ["chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.25.0", features = ["serde", "v4"] }

[patch.crates-io]
dioxus-sdk = { git = "https://github.com/ealmloff/dioxus-std.git", branch = "0.7" }

[features]
default = ["desktop", "escpos"]
bundle = []
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# Build in features for receipt printers
escpos = ["dep:escpos"]
